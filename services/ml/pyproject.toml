[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-risk-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2,<2",
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "polars-lts-cpu>=1.33,<1.34",
    "pyarrow>=17",
    "pydantic>=2.8",
    "scikit-learn>=1.5,<2",
    "typer>=0.12",
    "uvicorn>=0.32,<1",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27,<1", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
fire-risk-ml-api = "fire_risk.ml_api:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using .* with .* is deprecated",
]
